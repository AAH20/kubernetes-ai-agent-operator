apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentapprovals.agentmesh.a2zsoc.com
spec:
  group: agentmesh.a2zsoc.com
  scope: Namespaced
  names: {plural: agentapprovals, singular: agentapproval, kind: AgentApproval, shortNames: [aapprove]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [taskId, capability, artifactDigest, policyVersion, approver, expiresAt]
              properties:
                taskId: {type: string}
                capability: {type: string}
                artifactDigest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
                policyVersion: {type: string}
                approver: {type: string}
                expiresAt: {type: string, format: date-time}
