apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agenttasks.agentmesh.a2zsoc.com
spec:
  group: agentmesh.a2zsoc.com
  scope: Namespaced
  names:
    plural: agenttasks
    singular: agenttask
    kind: AgentTask
    shortNames: [atask]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [taskId, objective, acceptanceCriteria, capabilities, dataClassification, tenantTrust, mutationImpact, maximumCostUSD, idempotencyKey, policyVersion]
              properties:
                taskId: {type: string, minLength: 1}
                objective: {type: string, minLength: 1}
                acceptanceCriteria: {type: array, minItems: 1, items: {type: string}}
                capabilities: {type: object, additionalProperties: {type: string, enum: [allow, approval, deny]}}
                dataClassification: {type: string, enum: [public, internal, confidential, restricted]}
                tenantTrust: {type: string, enum: [single_trusted, trusted_team, untrusted_multi_tenant]}
                mutationImpact: {type: string, enum: [read, workspace, external, production]}
                maximumCostUSD: {type: number, exclusiveMinimum: true, minimum: 0}
                estimatedAgentUSD: {type: number, minimum: 0}
                contextRefs: {type: array, items: {type: string}}
                idempotencyKey: {type: string, minLength: 8}
                policyVersion: {type: string, minLength: 1}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
