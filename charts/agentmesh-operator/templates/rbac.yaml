apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agentmesh-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-agentmesh-operator
rules:
  - apiGroups: [agentmesh.a2zsoc.com]
    resources: [agenttasks, agenttasks/status, agentapprovals]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-agentmesh-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-agentmesh-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-agentmesh-operator
