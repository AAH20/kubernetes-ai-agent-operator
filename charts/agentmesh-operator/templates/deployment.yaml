apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agentmesh-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: agentmesh-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentmesh-operator}
    spec:
      serviceAccountName: {{ .Release.Name }}-agentmesh-operator
      securityContext: {runAsNonRoot: true}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- end }}"
          args: ["controller"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
